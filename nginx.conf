server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Browsers keep every file but check it on each load (a 304 if unchanged), so after a deploy the page never runs
    # with an older data, model or summary file than the one it was built with.
    add_header Cache-Control "no-cache";

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;


    # Show lab-setup.sql as text in the browser rather than downloading it.
    location ~ \.sql$ {
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
