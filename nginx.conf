server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;

    # Browsers keep these files but check them on every load (a 304 if unchanged), so after a deploy the page never
    # runs with an older manifest or query file than the one it was built with.
    location /focus/ {
        add_header Cache-Control "no-cache";
    }

    # Show lab-setup.sql as text in the browser rather than downloading it.
    location ~ \.sql$ {
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
